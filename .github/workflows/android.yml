name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web
        run: npm run build

      - name: Sincronizar con Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/cartomagia-beta-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: cartomagia-apk
          path: out/*.apk

      - name: Publicar release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Cartomagia beta ${{ github.run_number }}
          prerelease: true
          body: |
            APK de prueba de Cartomagia (build ${{ github.run_number }}, commit ${{ github.sha }}).
            Descarga el archivo .apk en tu Android e instálalo (permite "instalar apps de origen desconocido").
          files: out/*.apk
